name: Temporal embedding

on:
  push:
    branches:
      - feature/cyberneural-tissue-foundation
  pull_request:
    branches:
      - feature/cyberneural-tissue-foundation

jobs:
  temporal-embedding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev qt6-base-dev qt6-declarative-dev
      - name: Configure
        run: cmake -S . -B build-temporal -DBUILD_TESTING=ON -DSPIKINGMODEL_ENABLE_CUDA=OFF -DSPIKINGMODEL_ENABLE_QT_CLIENT=OFF
      - name: Build temporal embedding tests
        run: cmake --build build-temporal --target temporal_embedding_tests --parallel 2
      - name: Run temporal embedding tests
        run: ctest --test-dir build-temporal --output-on-failure -R temporal_embedding_tests
      - name: Configure Qt dashboard
        run: cmake -S . -B build-qt -DBUILD_TESTING=OFF -DSPIKINGMODEL_ENABLE_CUDA=OFF -DSPIKINGMODEL_ENABLE_QT_CLIENT=ON
      - name: Build Qt dashboard
        run: cmake --build build-qt --target spiking_model_dashboard --parallel 2
